[project]
name = "qpybase"
version = "0.1.0"
description = "qpybase libs for daily usage"
readme = "README.md"
requires-python = ">3.9"
dependencies = [
    "dynaconf>=3.2.6",
    "faker>=33.1.0",
    "inflection>=0.5.1",
    "loguru>=0.7.3",
    "pydantic>=2.10.3",
    "rich>=13.9.4",
    "structlog>=24.4.0",
]

[tool.hatch.build.targets.wheel.force-include]
"ci.py" = "ci.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
cleanup = "qpyci.commands:clean"
cov = "ci:coverage"
badge = "qpyci.commands:generate_badge"
check_format = "ci:check_format"


[tool.uv.sources]
qpyci = { git = "https://github.com/fluent-qa/qpyci.git", rev = "main" }

[tool.hatch.build.targets.wheel]
packages = ["qpybase"]

[dependency-groups]
lint = [
    "ruff>=0.8.3",
]
dev = [
    "allure-pytest>=2.13.5",
    "pytest-cov>=6.0.0",
    "pytest>=8.3.4",
    "coverage-badge>=1.1.2",
    "qpyci",
]

[tool.ruff]
line-length = 120
target-version = "py39"
include = [
    "qpyconf/**/*.py",
    "tests/**/*.py",
    "docs/**/*.py",
]

[tool.ruff.lint]
extend-select = [
    "Q",
    "RUF100",
    "C90",
    "UP",
    "I",
    "D",
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
isort = { combine-as-imports = true, known-first-party = ["qpyconf"] }
mccabe = { max-complexity = 15 }
ignore = [
    "D100", # ignore missing docstring in module
    "D102", # ignore missing docstring in public method
    "D104", # ignore missing docstring in public package
    "D105", # ignore missing docstring in magic methods
    "D107", # ignore missing docstring in __init__ methods
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# don't format python in docstrings, pytest-examples takes care of it
docstring-code-format = false
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"docs/**/*.py" = ["D"]
"src/qpyconf/**/*.py" = ["D101", "D103"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--alluredir", "allure-results",
    "--clean-alluredir",
    "-l", "-s", "--durations", "0",
    "--cov", "qpyconf"
]
log_cli = true
log_cli_level = "info"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s %(levelname)s %(message)s"
minversion = "6.0"
